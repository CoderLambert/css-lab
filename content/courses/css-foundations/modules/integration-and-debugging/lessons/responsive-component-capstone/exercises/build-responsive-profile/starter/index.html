<article class="dashboard">
  <header class="dashboard-header">
    <div class="dashboard-heading">
      <p class="eyebrow">Team workspace</p>
      <h2>Release notes</h2>
      <p class="summary">A small update for the people reviewing this component.</p>
    </div>
    <span class="status">Draft</span>
  </header>

  <div class="dashboard-grid">
    <section class="feature">
      <h3>What changed</h3>
      <p>Keep the important explanation readable while the available space changes.</p>
    </section>
    <aside class="details">
      <h3>Review details</h3>
      <dl>
        <div><dt>Owner</dt><dd>CSS team</dd></div>
        <div><dt>State</dt><dd>Ready</dd></div>
      </dl>
    </aside>
  </div>

  <footer class="dashboard-actions">
    <a href="#read">Read update</a>
    <a href="#save">Save for later</a>
  </footer>
</article>
