name: MDX Demo Validation

on:
  push:
    branches:
      - feat/mdx-learning-flow-demo

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          version: 12.5.1
          runtime: node@24
          cache: true
          install: false

      - name: Install dependencies and refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: update lockfile for MDX demo"
          git push

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
