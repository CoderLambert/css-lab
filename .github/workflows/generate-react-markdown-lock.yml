name: Generate React Markdown Lock

on:
  push:
    paths:
      - ".github/workflows/generate-react-markdown-lock.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm and Node
        uses: pnpm/setup@v3
        with:
          version: 12.5.1
          runtime: node@24
          cache: true
          install: false

      - name: Generate dependency files
        run: pnpm add react-markdown@10.1.0 --save-exact --lockfile-only

      - name: Commit dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: add markdown renderer"
          git push
